# Shampan POS - Framework-Only CI
#
# Validates ONLY the Playwright automation framework (TypeScript + the
# @framework-only project). It requires NO application login, NO API
# connectivity, and NO database - zero secrets. It must stay green independent
# of the auth / API / QA-DB blockers.
#
# REPO ASSUMPTION: this file lives at the ROOT of the dedicated
# Shampan-POS-Automation repository (i.e. the former SSL_POS/automation
# folder is the repo root, so package.json is at the working directory).
#
# If automation is later committed as a subfolder of another repository,
# working-directory and artifact paths must be adjusted accordingly.

name: POS Framework CI

on:
  workflow_dispatch: {}

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Least privilege: this workflow only needs to read repository contents.
permissions:
  contents: read

concurrency:
  group: pos-framework-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework:
    name: TypeScript + Framework Tests (no auth / API / DB)

    # Windows self-hosted runner.
    runs-on:
      - self-hosted
      - windows

    timeout-minutes: 20

    # Use Windows PowerShell 5.1 for all command steps.
    # This avoids dependency on PowerShell 7 / pwsh on the runner machine.
    defaults:
      run:
        shell: powershell

    env:
      CI: "true"
      HEADLESS: "true"

      # No BASE_URL, login credentials, API URL, DB credentials,
      # or other environment secrets are required by this workflow.

    steps:
      - name: Checkout automation repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      # The framework scaffold instantiates Page Objects that require Chromium.
      # No Linux OS dependency installation is needed on this Windows runner.
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Verify framework suite discovers tests
        run: |
          $out = npx playwright test --project=framework --list 2>&1 | Out-String

          Write-Host $out

          $m = [regex]::Match(
            $out,
            'Total:\s*(\d+)\s+test'
          )

          if (-not $m.Success) {
            Write-Error "Could not parse Playwright discovery output."
            exit 1
          }

          $count = [int]$m.Groups[1].Value

          if ($count -lt 1) {
            Write-Error "Framework suite discovered 0 tests - failing."
            exit 1
          }

          Write-Host "Framework tests discovered: $count"

      - name: Run framework-only tests
        run: npm run test:framework

      # Upload only non-sensitive generated test outputs.
      # .env and storage/*.json are never uploaded.

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: reports/html
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7